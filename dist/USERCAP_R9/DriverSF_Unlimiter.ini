; USER CAP R9: audio failure diagnostics; unchanged280/HASH180K values.
; MiB=1048576 bytes. Restart after editing. See R9_TEST.md.
; Streaming handlers/queues derive from max(512, ModelSlots + ReplayRetainedReferences).
[Limits]
RequestCapacity=280
AudioModelEntries=384
GlobalAudioEntries=4096
DefaultAudioMiB=128
ReplayReaderMiB=2
ReplayRetainedReferences=512

; Optional overrides below. Omitted coupled entries are calculated at startup.
; Do not uncomment these unchanged when increasing RequestCapacity.
; ModelSlots=160
; ObjectEntries=512
; DefinitionEntries=512
; PendingEntries=512
; CallbackEntriesPerGroup=512
; CleanupEntries=262144
; ResourceCollectionEntries=131072
; IndexedReferenceEntries=262144
HashExtraEntries=180000

[Traffic]
; AssetWeights adds positive-weight models to each named setting's native list.
; Native preserves the native requested list. Neither changes probability weights.
RosterSource=AssetWeights
