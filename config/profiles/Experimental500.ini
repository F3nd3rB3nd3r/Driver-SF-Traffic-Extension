; R10: UNTESTED starting configuration for a nominal 500-model experiment.
; This is not verified 500-model support or a measured memory requirement.
; Install matching assets and edit the active AI probability tables separately.
; Copy beside the R10 ASI as DriverSF_Unlimiter.ini, then restart the game.
; See CONFIGURATION.md for the worked example, dependencies and test steps.

[Limits]
; 500 intended models + 12 trial spare request entries. Check effectiveCount.
; The native list can include IDs outside your intended 500-model list.
RequestCapacity=512
; Model audio registrations: trial margin above the request ceiling.
AudioModelEntries=640
; Shared sound lists and byte pool: retained from exercised 280-model budgets.
; They are NOT measured requirements or confirmed sufficient for 500 models.
GlobalAudioEntries=4096
DefaultAudioMiB=128
; Per Replay reader owner; power of two in MiB (1048576 bytes).
ReplayReaderMiB=4
; Resource-reference capacity, not recording length or a model count.
ReplayRetainedReferences=1024
; Extra hash nodes: lifetime/resource demand, not one entry per car.
HashExtraEntries=180000

; Omit coupled advanced keys so they grow with the values above:
; ModelSlots -> 522
; ObjectEntries -> 526
; DefinitionEntries -> 522
; PendingEntries -> 526
; CallbackEntriesPerGroup -> 526 in each of 21 groups
; Work/handler/manager key capacity -> 1546 (derived; no INI key)
; Independent defaults retained by omission:
; CleanupEntries -> 262144
; ResourceCollectionEntries -> 131072
; IndexedReferenceEntries -> 262144
; Omission is not unlimited capacity. Inspect the relevant pool's demand.

[Traffic]
RosterSource=AssetWeights

[Diagnostics]
; Summary output with essential failures retained. Use 2 for a focused trace.
LogLevel=1
