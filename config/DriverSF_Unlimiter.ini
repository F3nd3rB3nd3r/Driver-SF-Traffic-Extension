; DriverSF Unlimiter:150-capacity baseline. Capacities do not force a roster.
; Restart after editing. See CONFIGURATION.md for meanings and derived values.
[Limits]
RequestCapacity=150
AudioModelEntries=192
GlobalAudioEntries=2048
DefaultAudioMiB=64
ReplayReaderMiB=1
ReplayRetainedReferences=256
HashExtraEntries=45000

[Traffic]
RosterSource=AssetWeights

[Diagnostics]
;0=startup/errors,1=periodic summaries(default),2=full diagnostic trace.
LogLevel=1
